<nav
  class="navbar navbar-expand-lg fixed-top navbar-primary"
  role="navigation"
  aria-label="Navegación principal"
>
  <div class="container">
    <a
      class="navbar-brand text-white fw-bold"
      routerLink="/"
      aria-label="Simulador Blockchain — Ir al inicio"
      >Simulador Blockchain</a
    >
    <button
      class="dark-toggle ms-auto"
      (click)="toggleTheme()"
      [attr.aria-label]="darkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    >
      {{ darkMode ? '☀️' : '🌙' }}
    </button>
  </div>
</nav>

<div class="container pt-5 mt-4">
  @if (blockchain.expertMode()) {
    <form class="d-flex justify-content-end gap-2 mb-3" aria-label="Configuración de minado">
      <div class="d-flex align-items-center gap-2">
        <label class="mb-0 label-sm" for="difficulty-select">Dificultad:</label>
        <select
          id="difficulty-select"
          class="form-select form-select-sm"
          style="width: auto"
          [ngModel]="blockchain.difficulty()"
          (ngModelChange)="blockchain.setDifficulty($event)"
          [ngModelOptions]="{ standalone: true }"
          aria-label="Seleccionar dificultad de minado"
        >
          @for (val of [2, 4, 6, 8, 10]; track val) {
            <option [value]="val">{{ val }} (0s)</option>
          }
        </select>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="mb-0 label-sm" for="nbits-select">Target (nBits):</label>
        <select
          id="nbits-select"
          class="form-select form-select-sm"
          style="width: auto"
          (change)="onNBitsChange($event)"
          aria-label="Seleccionar target nBits"
        >
          <option [value]="486604799">Genesis (0x1d00ffff)</option>
          <option [value]="469762047">6 ceros (0x1c00ffff)</option>
          <option [value]="452984831">8 ceros (0x1b00ffff)</option>
          <option [value]="436207615">10 ceros (0x1a00ffff)</option>
        </select>
      </div>
    </form>
  } @else {
    <button
      class="btn btn-sm mb-3 btn-expert"
      (click)="blockchain.toggleExpertMode()"
      aria-label="Activar modo experto"
    >
      Activar Modo Experto
    </button>
  }

  <router-outlet></router-outlet>
</div>
