<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Simulador Blockchain</title>
    <script>
      var l = window.location;
      var path = l.pathname.replace(/\/$/, '');
      if (path && path !== '/') {
        l.replace(l.origin + '/#' + path);
      } else {
        l.replace(l.origin + '/');
      }
    </script>
  </head>
  <body></body>
</html>
